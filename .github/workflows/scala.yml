name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 21
        distribution: liberica
    - name: Build JS
      run: ./build.sh
    - name: Browser smoke test
      run: bash ./test.sh
    - name: Pages deployment tests
      run: ./millw --no-server tests/PagesTests.scala
    - name: Upload public folder
      if: success()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: public
        path: public
        if-no-files-found: error
    - name: Preview location
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "After successful publishing, the preview will be at https://tylerprete.github.io/pi-calculator/previews/pr-$PR_NUMBER/" >> "$GITHUB_STEP_SUMMARY"
